## Error Handling

**Google Doc read failure**:
```
if MCP read fails:
    log_error("Failed to read Google Doc: {url}")
    skip_to_next_url()
```

**Config file missing**:
```
if config_file not found:
    error("Team config not found at: {config_path}")
    suggest("Create config using: rca-toolkit-draft/templates/config/team-config-example.yaml")
    exit(1)
```

**No patterns found**:
```
if batch mode and no recurring patterns:
    log_info("No recurring patterns found (all RCAs unique)")
    skip_runbook_generation()
```

