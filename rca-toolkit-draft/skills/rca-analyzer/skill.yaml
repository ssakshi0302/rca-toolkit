### Individual RCA Analysis
**Location**: `research/past rca/rca-analysis-[N].md`

**Contains**:
- Incident metadata (service, environment, priority, root cause)
- Timeline (incident start, detection, diagnosis, resolution)
- TTD/TTX/TTR breakdown
- Gaps identified (detection, diagnosis, remediation)
- Automation opportunities
- Expected time savings per phase

### Batch Synthesis
**Location**: `research/past rca/batch-synthesis.md`

**Contains**:
- Aggregate metrics (average TTD/TTX/TTR, ranges)
- Patterns identified (≥2 similar incidents)
- Missing alerts summary
- Runbook candidates
- ROI calculation (manual vs automated)
- Annual projection if patterns recur

### Executive Summary (if --generate-summary)
**Location**: `[project-root]/EXECUTIVE-SUMMARY.md`

**Purpose**: Leadership-ready incident automation action plan

**Requirements**:
- 1-2 pages maximum (3-5 minute read)
- Scannable format (tables and bullets, minimal text)
- Data-driven (percentages, hours, dollars)
- Action-oriented (specific alerts with thresholds, not generic)
- Quantified impacts (all findings reference specific RCAs)

**Contains**:
- 3-line executive summary (bottleneck, automation impact, ROI)
- Data overview table (RCAs analyzed, TTD/TTR averages, ranges)
- Critical findings (4 key issues: detection delays, manual correlation, recurring patterns, remediation gaps)
- Incident summary table (all RCAs with TTD/TTX/TTR, detection gaps, resolution actions)
- Immediate actions (30 days):
  - Alert table with specific thresholds (e.g., "DB CPU >80% for 10+ min")
  - Runbook table with diagnosis flow and remediation
  - Pre-flight validation requirements
- Short-term actions (60-90 days): Signal correlation, pattern matching, guided remediation
- Long-term actions (6-12 months): Auto-remediation, capacity planning, smart alerting
- ROI estimate table (current → target for TTD/TTX/TTR, annual hours saved)
- Recommendations (3-4 approvals with quantified impact, risk assessment, timeline)
- Appendix (data sources)

**Specification**: See `docs/executive-summary-spec.md` for complete formatting requirements

**When to generate**: After batch analysis when leadership review is needed

**Validation**:
- All alerts have specific thresholds (not "availability alert")
- All findings reference specific RCAs (e.g., "RCA #1: 20h TTD")
- All impacts are quantified (percentages or hours)
- No marketing language ("game-changer", "exciting", etc.)
- No platform comparison or evaluation steps (action plan only)

### Runbooks (if --generate-runbook)
**Location**: `runbooks/diagnosis/[service]-[pattern].md`

**Contains**:
- Pattern description (service, symptom, root cause)
- Symptoms (user impact + system indicators)
- Diagnosis steps (with decision points)
- Cross-service correlation
- Common pitfalls
- Related incidents
- Metadata (pattern confidence, team, services)

