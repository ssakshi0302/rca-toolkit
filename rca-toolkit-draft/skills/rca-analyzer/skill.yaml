# RCA Analyzer Skill

## Purpose
Identify automation opportunities and time reduction in incident response:
- **TTD (Time to Detect)**: Find missing alerts/metrics that would detect faster
- **TTX (Time to Diagnose)**: Generate runbooks to speed up causation analysis
- **TTR (Time to Remediate)**: Identify automation candidates for faster resolution
- **ROI**: Quantify time savings and annual cost reduction from automation

## Arguments

**Single RCA**:
- `<url>` - Google Doc URL

**Batch mode**:
- `--batch <url1>, <url2>, <url3>` - Multiple URLs (comma-separated)

**Options**:
- `--generate-runbook` - Generate runbook if pattern matches ≥2 RCAs
- `--config=<path>` - Team config file (default: `.claude/config/temporal-config.yaml`)
- `--environment=<env>` - Environment priority (prod/esvc/dev) for batch ordering

## Workflow

### 1. Parse Arguments
```
if args contains "--batch":
    urls = parse_batch_urls(args)
    mode = "batch"
else:
    urls = [parse_single_url(args)]
    mode = "single"

config_path = extract_config(args) or ".claude/config/temporal-config.yaml"
generate_runbook = check_runbook_flag(args)
```

### 2. Load Team Config
```yaml
# Read config from config_path
team:
  name: <team_name>
  service_prefix: <prefix>

knowledge:
  metrics_catalog: <path>
  query_patterns: <path>
  architecture: <path>

alerts:
  <alert_name>:
    services: [<services>]
    common_causes: [<causes>]
```

### 3. Prompt for Runbook Generation (if not specified)
```
if not generate_runbook specified:
    ask_user("Generate runbooks for recurring patterns? (y/n)")
    generate_runbook = user_response
```

### 4. Analysis Dispatch

**Single mode**:
```
analysis_result = spawn_analysis_subagent(
    url=urls[0],
    config=team_config,
    rca_number=next_rca_number()
)
save_analysis(analysis_result, path="research/past rca/rca-analysis-N.md")
```

**Batch mode**:
```
results = []
for url in urls:
    subagent = spawn_analysis_subagent(
        url=url,
        config=team_config,
        rca_number=next_rca_number(),
        background=true
    )
    results.append(subagent)

wait_for_all(results)
analyses = [r.output for r in results]
save_batch_analyses(analyses)
```

### 5. Pattern Detection

```
if mode == "batch":
    patterns = detect_patterns(analyses)
    # Pattern: (service, symptom, root_cause_category)
    # Example: ("temporalhistory", "high_errors", "db_saturation")

    recurring_patterns = [p for p in patterns if p.count >= 2]
```

### 6. Runbook Generation (if requested + pattern found)

```
if generate_runbook and recurring_patterns:
    for pattern in recurring_patterns:
        runbook = generate_deterministic_runbook(
            pattern=pattern,
            template=select_template(pattern),
            config=team_config,
            related_rcas=[a for a in analyses if matches(a, pattern)]
        )
        save_runbook(runbook, path=f"runbooks/{pattern.type}/{pattern.key}.md")
```

### 7. Output Summary

```
print_summary:
    - RCA count: N
    - Files saved: [paths]
    - Patterns identified: [patterns]
    - Runbooks generated: [runbook_paths] (if any)
    - Average TTD: <duration>
    - Average TTR: <duration>
    - Estimated ROI: $X-Y/year (if batch)
```

