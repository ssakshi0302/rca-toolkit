## Pattern Detection Logic

**Pattern matching** (deterministic):
```python
def detect_patterns(analyses):
    patterns = {}

    for analysis in analyses:
        # Extract pattern key
        pattern_key = (
            analysis.service,
            analysis.symptom_primary,
            analysis.root_cause_category
        )

        if pattern_key not in patterns:
            patterns[pattern_key] = {
                "count": 0,
                "rcas": [],
                "avg_ttd": [],
                "avg_ttr": []
            }

        patterns[pattern_key]["count"] += 1
        patterns[pattern_key]["rcas"].append(analysis.rca_number)
        patterns[pattern_key]["avg_ttd"].append(analysis.ttd_seconds)
        patterns[pattern_key]["avg_ttr"].append(analysis.ttr_seconds)

    # Filter recurring patterns (≥2 occurrences)
    recurring = {k: v for k, v in patterns.items() if v["count"] >= 2}

    return recurring
```

## Runbook Template Selection

**Template mapping** (from team config):
```yaml
runbook_patterns:
  diagnosis:
    db_cpu_saturation:
      symptoms: [high_cpu, slow_queries]
      template: templates/runbook/diagnosis-db-saturation.md
    mesh_routing_failure:
      symptoms: [upstream_connect_error, passthrough_traffic]
      template: templates/runbook/diagnosis-mesh-failure.md
    capacity_exhaustion:
      symptoms: [oomkilled, memory_pressure]
      template: templates/runbook/diagnosis-capacity-exhaustion.md

  remediation:
    rolling_restart:
      when: [memory_leak, stale_connections]
      template: templates/runbook/remediation-rolling-restart.md
    resource_scaling:
      when: [cpu_saturation, workload_surge]
      template: templates/runbook/remediation-resource-scaling.md
```

**Selection logic**:
```python
def select_template(pattern, config):
    symptom = pattern.symptom_primary
    root_cause = pattern.root_cause_category

    # Match symptom to diagnosis template
    for template_name, template_config in config.runbook_patterns.diagnosis.items():
        if symptom in template_config.symptoms:
            return {
                "type": "diagnosis",
                "name": template_name,
                "path": template_config.template
            }

    # Match root cause to remediation template
    for template_name, template_config in config.runbook_patterns.remediation.items():
        if root_cause in template_config.when:
            return {
                "type": "remediation",
                "name": template_name,
                "path": template_config.template
            }

    return None  # No template match
```

## Runbook Generation (Deterministic)

**Fill template with pattern data**:
```python
def generate_deterministic_runbook(pattern, template, config, related_rcas):
    # Load template
    template_content = read_file(template.path)

    # Extract placeholders: <service>, <metric_name>, <query_command>, etc.
    placeholders = extract_placeholders(template_content)

    # Fill from config + pattern + RCA data
    replacements = {
        "<service>": pattern.service,
        "<pattern_name>": format_pattern_name(pattern),
        "<frequency>": f"{pattern.count} incidents in {calculate_timespan(related_rcas)}",
        "<avg_ttd>": format_duration(mean(pattern.avg_ttd)),
        "<avg_ttr>": format_duration(mean(pattern.avg_ttr)),
        "<last_occurrence>": max([rca.date for rca in related_rcas]),
        "<related_rcas>": format_rca_list(related_rcas),

        # From config
        "<metric_name>": lookup_metric(pattern.symptom, config.knowledge.metrics_catalog),
        "<query_command>": lookup_query(pattern.symptom, config.knowledge.query_patterns),
        "<team>": config.team.name,
        "<alert_name>": lookup_alert(pattern.service, config.alerts),
    }

    # Replace placeholders
    runbook_content = template_content
    for placeholder, value in replacements.items():
        runbook_content = runbook_content.replace(placeholder, value)

    return runbook_content
```

